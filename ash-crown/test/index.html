<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}</style></head><body><title>灰の王冠</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
/* Layout: one-screen console. Screen on top, controller deck below (touch) or key legend (desktop). */
:root{
  --void:#07070f; --deck:#141726; --deck-edge:#4a3f28; --ink:#f3ede0; --muted:#9a9282;
  --gem:#f0cf86; --btn-a:#d4ab5e; --btn-b:#3a4058;
  --font:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif; --serif:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--void);color:var(--ink);font-family:var(--font);overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#app{height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;
  gap:8px;padding-inline:6px;padding-block:6px}
#bar{width:100%;max-width:768px;display:flex;justify-content:space-between;align-items:center;
  font-size:13px;color:var(--muted);letter-spacing:.08em}
#bar b{color:var(--gem);font-family:var(--serif);font-weight:800;letter-spacing:.14em}
#mute{font:inherit;color:var(--ink);background:var(--deck);border:1px solid var(--deck-edge);
  border-radius:6px;padding:4px 10px;cursor:pointer}
#mute:focus-visible,.pbtn:focus-visible{outline:2px solid var(--gem);outline-offset:2px}
#screen{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;
  border:2px solid var(--deck-edge);border-radius:6px;box-shadow:0 0 0 1px #000,0 0 30px rgba(240,207,134,.12),0 12px 40px #000a;max-width:100%}
#pad{width:100%;max-width:520px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex:0 0 auto}
#dpad{position:relative;width:150px;height:150px;flex:0 0 auto;touch-action:none}
#dpad::before,#dpad::after{content:"";position:absolute;background:var(--deck);border:2px solid var(--deck-edge);border-radius:10px}
#dpad::before{left:50px;top:0;width:46px;height:146px}
#dpad::after{top:50px;left:0;height:46px;width:146px}
#dpad i{position:absolute;z-index:1;width:0;height:0;border:9px solid transparent;pointer-events:none}
#dpad .u{left:66px;top:12px;border-bottom-color:var(--muted)}
#dpad .d{left:66px;bottom:12px;border-top-color:var(--muted)}
#dpad .l{top:66px;left:12px;border-right-color:var(--muted)}
#dpad .r{top:66px;right:12px;border-left-color:var(--muted)}
#dpad i.on{border-bottom-color:var(--gem)}#dpad i.d.on{border-top-color:var(--gem)}
#dpad i.l.on{border-right-color:var(--gem)}#dpad i.r.on{border-left-color:var(--gem)}
#mid{display:flex;flex-direction:column;align-items:center;gap:8px}
.pbtn{font:inherit;color:var(--ink);border:none;cursor:pointer;touch-action:none}
#menuBtn{background:var(--deck);border:1px solid var(--deck-edge);border-radius:14px;padding:6px 14px;font-size:12px;letter-spacing:.1em}
#ab{position:relative;width:150px;height:130px;flex:0 0 auto}
#ab .pbtn{position:absolute;width:66px;height:66px;border-radius:50%;font-size:15px;
  box-shadow:inset 0 -4px 0 #0005,0 3px 0 #000}
#btnA{right:0;top:6px;background:radial-gradient(circle at 35% 30%,#ffe6a8,var(--btn-a) 60%,#9a7434);color:#2a1e08;font-weight:700}
#btnB{left:0;bottom:6px;background:radial-gradient(circle at 35% 30%,#6a7290,var(--btn-b) 60%,#22263a)}
.pbtn.on{transform:translateY(2px);filter:brightness(1.25)}
#keys{display:none;font-size:13px;color:var(--muted);text-align:center;line-height:1.8}
#keys kbd{font:inherit;color:var(--ink);border:1px solid var(--deck-edge);border-radius:4px;padding:0 6px;background:var(--deck)}
#bar{flex-wrap:nowrap;gap:8px}
#bar .ttl{white-space:nowrap}
#bar .btns{display:flex;gap:8px;flex:0 0 auto}
@media (max-width:520px){#bar .sub{display:none}}
/* narrow phones: shrink the d-pad and buttons so all of them fit side by side */
@media (max-width:420px){body:not(.nodpad) #dpad,body:not(.nodpad) #ab{zoom:.82}#mid{flex:0 0 auto}}
#padToggle{display:none;font:inherit;color:var(--ink);background:var(--deck);border:1px solid var(--deck-edge);border-radius:6px;padding:4px 10px;cursor:pointer}
@media (pointer:coarse){#padToggle{display:inline-block}}
/* swipe replaces the d-pad: three big buttons in one row, more room for the screen */
body.nodpad #dpad{display:none}
body.nodpad #pad{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;max-width:520px}
body.nodpad #ab{display:contents}
body.nodpad #ab .pbtn{position:static;width:78px;height:78px;font-size:16px}
body.nodpad #btnB{grid-column:1;grid-row:1;justify-self:start}
body.nodpad #mid{grid-column:2;grid-row:1}
body.nodpad #btnA{grid-column:3;grid-row:1;justify-self:end}
body.nodpad #menuBtn{padding:12px 20px;font-size:14px}
@media (hover:hover) and (pointer:fine){#pad{display:none}#keys{display:block}}
/* landscape phone: the screen fills the height, controls float in the black side margins */
body.land #app{flex-direction:row;justify-content:center;align-items:center;padding:0;gap:0}
body.land #bar{position:fixed;top:4px;right:6px;width:auto;z-index:6;max-width:none}
body.land #bar .ttl{display:none}
body.land #bar button{padding:3px 8px;font-size:11px;opacity:.7}
body.land #screen{border-radius:0;border-width:1px}
body.land #pad{position:fixed;inset:0;max-width:none;display:block;pointer-events:none;z-index:5}
body.land #pad>*{pointer-events:none}
body.land .pbtn,body.land #dpad{pointer-events:auto}
body.land #ab{display:contents}
body.land #ab .pbtn{position:fixed;width:74px;height:74px;font-size:15px;opacity:.88}
body.land #btnA{right:22px;bottom:18px;top:auto;left:auto}
body.land #btnB{right:22px;bottom:104px;top:auto;left:auto}
body.land #mid{position:fixed;right:20px;top:34px}
body.land #menuBtn{pointer-events:auto;padding:8px 14px;opacity:.85}
body.land #dpad{position:fixed;left:18px;bottom:16px;zoom:.78}
body.land.nodpad #dpad{display:none}
body.land #keys{display:none}
</style>
<div id="app">
  <div id="bar"><span class="ttl"><b>ASH CROWN</b><span class="sub">　灰の王冠</span></span><span class="btns"><button id="smoothToggle" type="button">なめらか</button><button id="padToggle" type="button">十字キー</button><button id="mute" type="button">♪ ON</button></span></div>
  <canvas id="screen" width="768" height="672"></canvas>
  <div id="pad">
    <div id="dpad"><i class="u"></i><i class="d"></i><i class="l"></i><i class="r"></i></div>
    <div id="mid"><button class="pbtn" id="menuBtn" type="button">MENU</button></div>
    <div id="ab"><button class="pbtn" id="btnB" type="button">戻る</button><button class="pbtn" id="btnA" type="button">決定</button></div>
  </div>
  <div id="keys">移動 <kbd>↑↓←→</kbd>/<kbd>WASD</kbd>　決定 <kbd>Z</kbd>/<kbd>Enter</kbd>　戻る <kbd>X</kbd>　メニュー <kbd>C</kbd>/<kbd>Esc</kbd></div>
</div>

  // 曲を Transport に載せる。once なら1回だけ。戻り値は曲の長さ(秒)
  schedule(rig, tr, onEnd) {
    const S = Audio8.build(tr), step = S.step, hz = m => Tone.Frequency(m, 'midi').toFrequency();
    rig.delay.delayTime.value = Math.min(1.4, step * 3);
    const part = new Tone.Part((time, e) => {
      const dur = (e.d || 0.5) * step;
      switch (e.ch) {
        case 'mel': rig.lead.triggerAttackRelease(hz(e.m), dur, time); break;
        case 'harm': rig.harm.triggerAttackRelease(hz(e.m), dur, time); break;
        case 'pad': rig.pad.triggerAttackRelease(hz(e.m), dur, time); break;
        case 'bass': rig.bass.triggerAttackRelease(hz(e.m), dur, time); break;
        case 'arp': rig.arp.triggerAttackRelease(hz(e.m), dur, time); break;
        case 'kick': rig.kick.triggerAttackRelease('C1', 0.2, time); break;
        case 'tom': rig.tom.triggerAttackRelease(110 + (e.m || 0) * 40, 0.2, time); break;
        case 'snare': rig.snare.triggerAttackRelease(0.16, time); break;
        case 'hat': rig.hat.triggerAttackRelease(0.04, time, e.soft ? 0.5 : 1); break;
        case 'crash': rig.crash.triggerAttackRelease(1.2, time); break;
      }
    }, S.evs.map(e => [e.t * step, e]));
    part.humanize = false;
    if (S.once) { part.loop = false; if (onEnd) Tone.getTransport().scheduleOnce(() => onEnd(), S.len * step + 0.2); }
    else { part.loop = true; part.loopStart = S.loopFrom * step; part.loopEnd = S.len * step; }
    part.start(0);
    return { part, seconds: S.len * step };
  },
  async start() { try { await Tone.start(); this.ready = true; if (!this.rig) this.rig = this.makeRig(); Tone.getDestination().mute = Audio8.muted; } catch (e) { this.ok = false; console.warn('Tone start failed', e); } },
  play(name, after) {
    const tr = TRACKS[name]; if (!tr || !this.rig) return;
    this.stop(true); const T = Tone.getTransport(); T.cancel(); T.stop();
    const nx = after || null;

    this.part = r.part; this.rig.master.gain.cancelScheduledValues(Tone.now()); this.rig.master.gain.setValueAtTime(0.0001, Tone.now()); this.rig.master.gain.linearRampToValueAtTime(1, Tone.now() + 0.2);
    T.start('+0.05');
  },
  stop(quick) {
    if (!this.rig) return; const T = Tone.getTransport();
    if (this.part) { this.part.dispose(); this.part = null; }
    this.rig.pad.releaseAll(); this.rig.master.gain.cancelScheduledValues(Tone.now());
    if (!quick) { this.rig.master.gain.setValueAtTime(this.rig.master.gain.value, Tone.now()); this.rig.master.gain.linearRampToValueAtTime(0.0001, Tone.now() + 0.25); }
  },

if (ToneMusic.ok) {
  const orig = { play: Audio8.play, stop: Audio8.stop, unlock: Audio8.unlock, setMuted: Audio8.setMuted };
  Audio8.unlock = function () { orig.unlock.call(this); if (ToneMusic.ok && !ToneMusic.ready && !ToneMusic.starting) { ToneMusic.starting = true; ToneMusic.start().then(() => { ToneMusic.starting = false; if (ToneMusic.ok && this.want) { this.cur = null; this.play(this.want, this.after); } }); } };
  Audio8.play = function (name, after) {
    if (!ToneMusic.ok) return orig.play.call(this, name, after);
    this.want = name; this.after = after || null;

    this.cur = name; if (!name) { ToneMusic.stop(); return; }

  };
  Audio8.stop = function () { if (!ToneMusic.ok) return orig.stop.call(this); this.cur = null; ToneMusic.stop(); };
  Audio8.setMuted = function (m) { orig.setMuted.call(this, m); if (ToneMusic.ready) Tone.getDestination().mute = m; };
}

// ===================== ART (procedural pixel art) =====================
const T = 16;
function px(x, c, X, Y, W = 1, H = 1) { x.fillStyle = c; x.fillRect(X, Y, W, H); }
function speckle(x, r, cols, n, w = 16, h = 16) { for (let i = 0; i < n; i++) px(x, pick2(r, cols), Math.floor(r() * w), Math.floor(r() * h)); }
function canopy(x, r, cx, cy, rad) {
  const blob = (bx, by, rr, col) => { for (let yy = -rr; yy <= rr; yy++) for (let xx = -rr; xx <= rr; xx++) if (xx * xx + yy * yy <= rr * rr + rr * 0.8) px(x, col, Math.round(bx + xx), Math.round(by + yy)); };
  blob(cx, cy, rad, '#1c4a22'); blob(cx - 0.5, cy - 0.5, rad - 1, '#2c7432');
  for (let i = 0; i < rad * 3; i++) { const a = r() * 6.28, d = r() * (rad - 1); px(x, r() < 0.5 ? '#24602a' : '#3a8c3a', Math.round(cx + Math.cos(a) * d), Math.round(cy + Math.sin(a) * d)); }
  blob(cx - Math.ceil(rad / 3), cy - Math.ceil(rad / 3), Math.max(1, Math.floor(rad / 2)), '#46a043');
  px(x, '#78c85e', cx - Math.ceil(rad / 2), cy - Math.ceil(rad / 2), 2, 1); px(x, '#78c85e', cx - Math.ceil(rad / 2), cy - Math.ceil(rad / 2) + 1, 1, 1);
}
function pick2(r, a) { return a[Math.floor(r() * a.length)]; }

// Each enemy is drawn by a function of the animation phase a (0..2π). Shapes use banded gradients
// (hard colour steps, like hand-shaded pixel art), then get crisp edges, coloured outlines and shading.
function bandR(x, cx, cy, r, cols) { const g = x.createRadialGradient(cx, cy, 0, cx, cy, r); const n = cols.length; cols.forEach((c, i) => { g.addColorStop(i / n, c); g.addColorStop(Math.min(1, (i + 1) / n - 0.0001), c); }); return g; }
function bandL(x, x0, y0, x1, y1, cols) { const g = x.createLinearGradient(x0, y0, x1, y1); const n = cols.length; cols.forEach((c, i) => { g.addColorStop(i / n, c); g.addColorStop(Math.min(1, (i + 1) / n - 0.0001), c); }); return g; }
function fp(x, style, fn) { x.fillStyle = style; x.beginPath(); fn(); x.fill(); }
function oval(x, cx, cy, rx, ry, style) { fp(x, style, () => x.ellipse(cx, cy, Math.max(0.1, rx), Math.max(0.1, ry), 0, 0, Math.PI * 2)); }
function tri(x, a, b, c, d, e, f, style) { fp(x, style, () => { x.moveTo(a, b); x.lineTo(c, d); x.lineTo(e, f); x.closePath(); }); }
function pl(x, pts, style) { fp(x, style, () => { x.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) x.lineTo(pts[i], pts[i + 1]); x.closePath(); }); }
function ln(x, x0, y0, x1, y1, col, w = 1) { x.strokeStyle = col; x.lineWidth = w; x.lineCap = 'round'; x.beginPath(); x.moveTo(x0, y0); x.lineTo(x1, y1); x.stroke(); }
function dot(x, col, a, b, w = 1, h = 1) { x.fillStyle = col; x.fillRect(Math.round(a), Math.round(b), w, h); }
function glowEye(x, cx, cy, col, core = '#ffffff', w = 2, h = 2) { dot(x, col, cx - 1, cy - 1, w + 2, h + 2); dot(x, core, cx, cy, Math.max(1, w - 1), Math.max(1, h - 1)); }
function E2(w, h, fn, outline = '#140c1c', post) { const c = mkCanvas(w, h); const x = c.getContext('2d', { willReadFrequently: true }); fn(x, w, h); pixelize(c, outline); stylize(c, { grad: true }); if (post) post(x, w, h); return c; }

    let key = key0; const ch = m.g[y][x];

    const img = TILE_IMG[key]; ctx.drawImage(img[ANIM_TILES.has(key) ? f : 0], x * T - cx, y * T - cy);

  ctx.drawImage(img, sx * D, sy * D, (ex - sx) * D, (ey - sy) * D, sx - cx, sy - cy, ex - sx, ey - sy);
}

function expToNext(lv) { return Math.round(5 * lv * lv + 10 * lv); }
function expAt(lv) { let s = 0; for (let l = 1; l < lv; l++) s += expToNext(l); return s; }

// ===================== MAPS =====================
function grid(w, h, ch) { return Array.from({ length: h }, () => Array(w).fill(ch)); }
function fromRows(rows) { const w = Math.max(...rows.map(r => r.length)); return rows.map(r => (r + '#'.repeat(w)).slice(0, w).split('')); }
function fillRect(g, x, y, w, h, ch) { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) if (g[j] && g[j][i] !== undefined) g[j][i] = ch; }
function house(g, x, y, w, roof, doorX) {
  fillRect(g, x, y, w, 2, roof);
  for (let i = 0; i < w; i++) g[y + 2][x + i] = (x + i === doorX) ? 'D' : (i === 0 || i === w - 1 ? 'W' : (i % 2 ? 'N' : 'W'));
}

function buildWorld() {
  const W = 44, H = 32; const g = grid(W, H, '.'); const r = mulberry(4242);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const d = Math.min(x, y, W - 1 - x, H - 1 - y);
    if (d < 2 || (d < 3 && r() < 0.45)) g[y][x] = '~';
  }
  // organic patches with ragged edges instead of rectangles
  const blob = (cx, cy, rx, ry, ch) => { for (let y = Math.floor(cy - ry - 1); y <= cy + ry + 1; y++) for (let x = Math.floor(cx - rx - 1); x <= cx + rx + 1; x++) {
    if (!g[y] || g[y][x] === undefined || g[y][x] === '~' && ch !== '~') continue; const d = ((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2; if (d < 1 + (r() - 0.5) * 0.7) g[y][x] = ch; } };
  // forests & hills (north)
  blob(5, 4, 2.6, 1.8, 'T'); blob(17.5, 5.5, 3, 2.2, 'T'); blob(34, 4, 4.2, 1.8, 'T'); blob(35, 7, 2.2, 1.2, 'T'); blob(28, 4.5, 1.6, 1.2, 'T');

  blob(10.5, 27.2, 5.2, 1.7, 's'); blob(38, 26.5, 2.2, 1.1, 'h'); blob(26, 21, 1.6, 1.2, 'h');
  // landmarks (ensure surroundings walkable)

  g[13][24] = 'C'; g[12][24] = '.'; g[12][23] = '.'; g[12][25] = '.'; g[13][23] = 'M'; g[13][25] = 'M';

    maxhp: Math.min(9999, g('hp')), maxmp: Math.min(999, g('mp')), str: g('str'), def: g('def') + (a.def || 0), mag: g('mag') + (w.mag || 0),

  G.party.push(newMember(id, lv));

    const before = stats(m); const known = skillsOf(m);

    msgs.push(`${HEROES[m.id].name}はレベル${m.lv}になった!`);
    for (const s of skillsOf(m)) if (!known.includes(s)) msgs.push(`${HEROES[m.id].name}は「${SKILLS[s].name}」を覚えた!`);

  if (c !== 0) { yield* say('またのお越しをお待ちしております。', '宿屋'); return; }
  if (G.gil < price) { yield* say('お金が足りないようですね…', '宿屋'); return; }
  G.gil -= price; yield { t: 'fadeout' }; Audio8.play('inn'); healAll(); yield { t: 'wait', n: 150 };
  Audio8.play(G.map.music); yield { t: 'fadein' };

function runScript(fn, onDone, ...args) {

    } else if (Input.pressed.a || Input.pressed.b) { Audio8.sfx('cursor'); if (d.pages && d.pages.length) { d.text = d.pages.shift(); d.shown = 0; } else { G.dialog = null; advance(); } }

  } else if (c.t === 'choice') {
    const ch = G.choice;

    if (Input.rep('down')) { ch.i = (ch.i + 1) % ch.opts.length; Audio8.sfx('cursor'); }

const Field = {

  tdef(ch) { return TILESETS[G.map.set][ch] || ['grass', 1]; },

let transitionCb = null;

    const r = mulberry(G.frame + 7), C = 8, R = 7, cw = SW / C, ch = SH / R; const pts = [];
    for (let j = 0; j <= R; j++) { pts.push([]); for (let i = 0; i <= C; i++) { const edge = i === 0 || j === 0 || i === C || j === R; pts[j].push([i * cw + (edge ? 0 : (r() - 0.5) * cw * 0.7), j * ch + (edge ? 0 : (r() - 0.5) * ch * 0.7)]); } }

      const xs = s.tri.map(q => q[0] * SCALE), ys = s.tri.map(q => q[1] * SCALE); const bx = Math.max(0, Math.floor(Math.min(...xs)) - 2), by = Math.max(0, Math.floor(Math.min(...ys)) - 2);

function mkEnemy(id, idx) {

    hitT: 0, dying: 0, alive: true, poison: false, stolen: false, turn: 0, phase2: false, buff: 1, i: idx, kb: 0 };
}
function layoutEnemies(es) {
  const n = es.length; const AX = 8, AW = 156;

    es.forEach((e, i) => { e.x = Math.round(x); e.y = Math.round(118 - e.h - (i % 2) * 14); x += e.w + 8; });
  } else {
    const front = es.slice(0, Math.ceil(n / 2)), back = es.slice(Math.ceil(n / 2));
    for (const [row, bottom, off] of [[back, 78, 16], [front, 124, 0]]) {
      const tw = row.reduce((s, e) => s + e.w, 0) + 6 * (row.length - 1); let x = AX + off + (AW - off - tw) / 2;
      row.forEach(e => { e.x = Math.round(x); e.y = Math.round(bottom - e.h); x += e.w + 6; });
    }

  const seen = {}; es.forEach(e => { if (cnt[e.id] > 1) { seen[e.id] = (seen[e.id] || 0) + 1; e.name = e.d.name + 'ABCD'[seen[e.id] - 1]; } });
}

  },
  update() {
    const M = B.menu; const m = G.party[M.who];

    if (M.stage === 'cmd') {
      if (Input.rep('up')) { M.ci = (M.ci + 5) % 6; Audio8.sfx('cursor'); }
      if (Input.rep('down')) { M.ci = (M.ci + 1) % 6; Audio8.sfx('cursor'); }

      }
      if (!Input.pressed.a) return;

        case 0: this.target({ kind: 'skill', id: 'attack' }, 'enemy'); break;
        case 1: M.list = skillsOf(m).concat(m.id === 'lina' && echoReady() ? ['echo'] : []).map(id => ({ id, label: SKILLS[id].name, right: id === 'echo' ? Math.floor(B.echo) + '%' : SKILLS[id].mp ? String(SKILLS[id].mp) : '', ok: id === 'echo' ? B.echo >= 100 : m.mp >= SKILLS[id].mp, desc: SKILLS[id].desc })); M.listKind = 'skill'; M.stage = 'list'; M.li = 0; M.scroll = 0; break;
        case 2: M.list = Object.keys(G.inv).filter(id => ITEMS[id].type === 'use' && ITEMS[id].field !== 'only').map(id => ({ id, label: ITEMS[id].name, right: '×' + G.inv[id], ok: true, desc: ITEMS[id].desc })); M.listKind = 'item'; M.stage = 'list'; M.li = 0; M.scroll = 0;
          if (!M.list.length) { M.stage = 'cmd'; Audio8.sfx('error'); } break;
        case 3: this.close({ kind: 'defend' }); break;
        case 4: this.close({ kind: 'flee' }); break;
        case 5: G.auto = true; Store.set('ash-crown-auto', '1'); Audio8.sfx('ok'); break; // from here on the party fights by itself (MENU switches it off again)
      }
    } else if (M.stage === 'list') {
      const n = M.list.length;
      if (Input.rep('up')) { M.li = (M.li - 2 + n) % n; Audio8.sfx('cursor'); }
      if (Input.rep('down')) { M.li = (M.li + 2) % n; if (M.li >= n) M.li = n - 1; Audio8.sfx('cursor'); }
      if (Input.rep('left') || Input.rep('right')) { M.li = M.li ^ 1; if (M.li >= n) M.li = n - 1; Audio8.sfx('cursor'); }

        Audio8.sfx('ok');
        if (M.listKind === 'skill') { const sk = SKILLS[e.id]; this.target({ kind: 'skill', id: e.id }, sk.target); }
        else this.target({ kind: 'item', id: e.id }, ITEMS[e.id].target);
      }
    } else if (M.stage === 'target') {
      const mode = M.tmode;
      if (mode === 'enemies' || mode === 'allies') {

      }

      }

function fieldUseItem(id, m) {
  const it = ITEMS[id]; const s = stats(m);
  if (it.tent) { healAll(); return 'みんなの体力が回復した!'; }
  if (it.target === 'allies') { let n = 0; for (const p of G.party) { const ps = stats(p); if (p.hp > 0 && p.hp < ps.maxhp) { p.hp = Math.min(ps.maxhp, p.hp + it.heal); n++; } } return n ? 'みんなのHPが回復した!' : null; }
  if (it.revive) { if (m.hp > 0) return null; m.hp = Math.max(1, Math.floor(s.maxhp * it.revive)); return `${HEROES[m.id].name}が復活した!`; }
  if (m.hp <= 0) return null;
  if (it.full) { m.hp = s.maxhp; m.mp = s.maxmp; return 'HPとMPが全回復した!'; }
  if (it.heal) { if (m.hp >= s.maxhp) return null; const n = Math.min(it.heal, s.maxhp - m.hp); m.hp += n; return `HPが${n}回復した!`; }
  if (it.mpheal) { if (m.mp >= s.maxmp) return null; const n = Math.min(it.mpheal, s.maxmp - m.mp); m.mp += n; return `MPが${n}回復した!`; }
  if (it.cure) { if (!m.poison) return null; m.poison = false; return '毒が治った!'; }
  return null;
}
function fieldCast(sid, caster, target) {
  const sk = SKILLS[sid]; if (caster.mp < sk.mp) return 'MPが足りない!';
  const cs = stats(caster); const amt = () => Math.round(sk.power + cs.mag * 2.4);
  const tgts = sk.target === 'allies' ? G.party.filter(p => p.hp > 0) : [target];
  let did = false;
  for (const t of tgts) {
    const s = stats(t);
    if (sk.kind === 'heal' && t.hp > 0 && t.hp < s.maxhp) { t.hp = Math.min(s.maxhp, t.hp + amt()); did = true; }
    if (sk.kind === 'revive' && t.hp <= 0) { t.hp = Math.max(1, Math.floor(s.maxhp * 0.4)); did = true; }
  }
  if (!did) return null;
  caster.mp -= sk.mp; return `${sk.name}をとなえた!`;
}
