<style>
html,body{margin:0;height:100%;background:#0b0b14;overflow:hidden}
#tac{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b0b14;-webkit-user-select:none;user-select:none;touch-action:none;font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP","Meiryo","IPAGothic","WenQuanYi Zen Hei",sans-serif}
#tac canvas{display:block;image-rendering:pixelated;background:transparent;touch-action:none}
#tac #cv{position:relative;z-index:1}
#tac #cvb{background:#06070f;position:absolute;left:0;top:0;pointer-events:none;z-index:0;image-rendering:auto}
#tac .pad{position:absolute;display:flex;gap:8px;z-index:3}
#tac button{white-space:nowrap;font:bold 12px/1 "Hiragino Kaku Gothic ProN","Noto Sans JP","Meiryo","IPAGothic","WenQuanYi Zen Hei",sans-serif;color:#eef;background:#27305a;border:2px solid #7f8fe0;border-radius:10px;padding:0 10px;min-width:50px;height:44px;touch-action:manipulation}
#tac button.auto.on{background:#c98a10;border-color:#ffe27a;color:#fff;box-shadow:0 0 10px #ffd24a}
#tac button.ok{background:#1f6a3a;border-color:#7fe0a0}
#tac button:active{background:#4a58a8}
#tac button.end{background:#6a2a2a;border-color:#e08f8f}
#pads{display:contents}
#tac #cvh{background:transparent;position:absolute;left:0;top:0;pointer-events:none;z-index:2}
#tac #cv2{display:none;background:#0b0b14}
#tac.port{flex-direction:column;justify-content:flex-start;padding-top:8px;box-sizing:border-box;gap:0}
#tac.port.bt #cv2{display:block}
#tac.port #pads{display:flex;flex-direction:column-reverse;align-items:center;gap:6px;margin-top:8px;width:100%;padding:0 12px;box-sizing:border-box}
#tac.port .pad{position:static;display:flex;gap:8px;justify-content:center;width:100%;max-width:420px}
#tac.port #padR button{flex:1;min-width:0}
#tac.port #padR #bMenu{flex:0 0 52px}
#tac.port #padL button{flex:1;height:48px}
#tac.port #padL button.ok{flex:2;height:52px;font-size:16px}
#tac button.tg.on{background:#8a2a5a;border-color:#ff8fb8;color:#fff;box-shadow:0 0 8px #ff5a8a}
#tac button:disabled{opacity:.4}
#tac.nopads .pad{display:none}
#tac [hidden]{display:none!important}
#tac .pad:not(:has(button:not([hidden]))){display:none}
#tac button#bMenu{font-size:20px;padding:0}
#tac.land button#bMenu{font-size:20px}
#tac button.ok{box-shadow:0 0 12px #3fe07a88}
#tac.land .pad{top:0;bottom:0;flex-direction:column;justify-content:center;width:80px}
#tac.land #padL{left:0;align-items:center}
#tac.land #padR{right:0;align-items:center}
#tac.land button{width:70px;padding:0;font-size:12px;height:40px}
#sheet{position:absolute;inset:0;z-index:9;background:rgba(4,5,16,.62);display:flex;align-items:center;justify-content:center}
#sheet .sh{width:min(86vw,340px);max-height:92%;overflow:auto;background:#141a44;border:2px solid #7f8fe0;border-radius:14px;padding:10px;box-sizing:border-box}
#sheet .shT{font:bold 13px/1 sans-serif;color:#ffd24a;text-align:center;padding:4px 0 8px}
#sheet button{display:flex;justify-content:space-between;align-items:center;width:100%;height:46px;margin:0 0 6px;font-size:15px;padding:0 14px;border-radius:10px}
#sheet button i{font-style:normal;color:#9fe8ff}
#sheet button i.on{color:#7dffa0}
#sheet button.dn{background:#4a2a2a;border-color:#e08f8f}
#tac.land #sheet button{height:38px;margin-bottom:4px}
</style>
<div id="tac" class="port">
<canvas id="cvb"></canvas>
<canvas id="cv" width="320" height="240"></canvas>
<canvas id="cvh"></canvas>
<canvas id="cv2" width="320" height="78"></canvas>
<div id="pads">
<div class="pad" id="padL"><button id="bCancel" hidden>キャンセル</button><button id="bOk" class="ok" hidden>決定</button></div>
<div class="pad" id="padR"><button id="bUndo">戻す ↺3</button><button id="bEnd" class="end">ターン終了</button><button id="bAuto" class="auto">オート</button><button id="bMenu" aria-label="メニュー">≡</button></div>
</div>
<div id="sheet" hidden><div class="sh"><div class="shT">設定</div><div id="shRows"></div></div></div>
</div>
